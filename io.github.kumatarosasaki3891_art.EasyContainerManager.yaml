app-id: io.github.kumatarosasaki3891_art.EasyContainerManager
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: EasyContainerManager

finish-args:
  # Avalonia UI / Wayland / X11
  - --socket=x11
  - --share=ipc
  - --device=dri
  # ネットワークアクセス（マスターデータ取得および SSH 接続）
  - --share=network
  # ssh-agent 連携
  - --socket=ssh-auth
  # ポータル連携（ファイル／フォルダ選択ダイアログ、既定ブラウザ起動）
  - --talk-name=org.freedesktop.portal.Desktop
  # ホスト上のコンテナエンジン (docker / podman / nerdctl)・ssh・ターミナル連携
  - --talk-name=org.freedesktop.Flatpak

sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10

build-options:
  prepend-path: /usr/lib/sdk/dotnet10/bin
  append-ld-library-path: /usr/lib/sdk/dotnet10/lib
  prepend-pkg-config-path: /usr/lib/sdk/dotnet10/lib/pkgconfig
  env:
    DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

modules:
  - name: easycontainermanager
    buildsystem: simple
    build-commands:
      # 事前取得した NuGet パッケージ（nuget-sources）を参照して自己完結バイナリを発行
      - dotnet publish EasyContainerManager/EasyContainerManager.fsproj -c Release -r linux-x64 --self-contained true --source ./nuget-sources -o /app/lib/EasyContainerManager

      # 起動コマンド (/app/bin/EasyContainerManager) のシンボリックリンク作成
      - install -d /app/bin
      - ln -s /app/lib/EasyContainerManager/EasyContainerManager /app/bin/EasyContainerManager

      # .desktop ファイルのインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyContainerManager.desktop /app/share/applications/io.github.kumatarosasaki3891_art.EasyContainerManager.desktop

      # metainfo.xml のインストール
      - install -Dm644 io.github.kumatarosasaki3891_art.EasyContainerManager.metainfo.xml /app/share/metainfo/io.github.kumatarosasaki3891_art.EasyContainerManager.metainfo.xml

      # アプリアイコン (256x256) のインストール
      - install -Dm644 EasyContainerManager/Assets/icon.png /app/share/icons/hicolor/256x256/apps/io.github.kumatarosasaki3891_art.EasyContainerManager.png

    sources:
      # ローカルソースからのビルド用（Flathub 提出時は下記の type: git に切り替える）
      - type: dir
        path: .
      # Flathub 審査・本番ビルド用（タグおよびコミットSHA固定）
      # - type: git
      #   url: https://github.com/kumatarosasaki3891-art/EasyContainerManager.git
      #   tag: linux-v1.1.0
      #   commit: <COMMIT_SHA>
      # オフラインビルド用 NuGet パッケージ定義
      - nuget-sources.json
